<div id="rainline-map-designs">
  <style>
    #rainline-map-designs { container-type:inline-size; --stage:clamp(416px,calc(50cqw + 123px),650px); }
    #rainline-map-designs .map-screen { --back:light-dark(#e4e6da,#101a19); --text:light-dark(#20312c,#ebeee2); --secondary:light-dark(#53685d,#a1b4a6); --line:light-dark(#9caaa0,#394a42); --chip:light-dark(#f7f4e8,#202e2a); --route:#f3bd72; --water-route:#a3e3df; color:var(--text); background:var(--back); min-height:var(--stage); display:grid; grid-template-rows:auto 1fr auto; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif; }
    #rainline-map-designs .map-screen[hidden] { display:none; }
    #rainline-map-designs .tactical { --back:light-dark(#e3e9ec,#0b1119); --text:light-dark(#182933,#e1ebf1); --secondary:light-dark(#45616c,#91abb9); --line:light-dark(#a1b4b9,#2f4956); --chip:light-dark(#f4f5f2,#17242e); --route:#f2c072; --water-route:#8acbd8; }
    #rainline-map-designs .field { --back:light-dark(#e9e3cc,#292c23); --text:light-dark(#393d30,#ede5c9); --secondary:light-dark(#586050,#c4c4a4); --line:light-dark(#a7a48b,#626553); --chip:light-dark(#f6eed5,#363b2e); --route:#7d4b31; --water-route:#31657a; }
    #rainline-map-designs .map-title { display:flex; justify-content:space-between; gap:14px; align-items:center; padding:15px 22px; border-bottom:1px solid var(--line); }
    #rainline-map-designs .map-title h2 { margin:0; font-size:23px; line-height:1.2; font-weight:650; letter-spacing:.08em; }
    #rainline-map-designs .map-title p { margin:4px 0 0; color:var(--secondary); font-size:12px; line-height:1.4; }
    #rainline-map-designs .field .map-title h2 { font-family:"Songti SC","STSong",serif; font-weight:700; letter-spacing:.16em; }
    #rainline-map-designs .key { font:500 12px/1 ui-monospace,monospace; border:1px solid var(--line); padding:5px 8px; margin-right:6px; }
    #rainline-map-designs .map-context { white-space:nowrap; color:var(--secondary); font-size:12px; }
    #rainline-map-designs .map-content { align-self:stretch; display:grid; align-items:center; min-width:0; }
    #rainline-map-designs .tactical .map-content { grid-template-columns:minmax(0,1fr) minmax(160px,22%); gap:16px; padding:12px 16px; }
    #rainline-map-designs .field .map-content { padding:10px 16px 2px; }
    #rainline-map-designs .map-plane { width:100%; aspect-ratio:1280/636; position:relative; isolation:isolate; overflow:hidden; color:#fff1d4; }
    #rainline-map-designs .field .map-plane { color:#343c31; }
    #rainline-map-designs .map-image, #rainline-map-designs .route-drawing { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:block; pointer-events:none; }
    #rainline-map-designs .map-image { background:#203838; }
    #rainline-map-designs .map-plane::after { position:absolute; inset:0; z-index:0; content:""; pointer-events:none; background:linear-gradient(145deg,#0e181a22,transparent 40%,#0a151b21); }
    #rainline-map-designs .route-drawing { z-index:1; }
    #rainline-map-designs .map-points { position:absolute; inset:0; pointer-events:none; z-index:2; }
    #rainline-map-designs .point { display:grid; justify-items:center; position:absolute; transform:translate(-50%,-50%); color:#fef2d9; background:transparent; border:0; padding:3px; pointer-events:auto; }
    #rainline-map-designs .field .point { color:#30392a; }
    #rainline-map-designs .point-symbol { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; background:#182824; color:#fff2d8; border:1px solid #e5d9ad; box-sizing:border-box; font-weight:600; font-size:14px; }
    #rainline-map-designs .point-symbol svg, #rainline-map-designs .point-symbol i { width:15px; height:15px; }
    #rainline-map-designs .field .point-symbol { color:#3c432f; background:#e4dac0; border-color:#5e6651; }
    #rainline-map-designs .point[aria-pressed="true"] .point-symbol { background:var(--route); border-color:var(--route); color:#19252a; box-shadow:0 0 0 4px #f7da9750; }
    #rainline-map-designs .field .point[aria-pressed="true"] .point-symbol { color:#fff2d0; }
    #rainline-map-designs .point-label { position:absolute; top:31px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:12px; line-height:1.2; font-weight:650; text-shadow:0 1px 3px #021518,0 0 4px #021518; }
    #rainline-map-designs .field .point-label { text-shadow:0 0 3px #f2ead1,0 0 5px #f2ead1; }
    #rainline-map-designs .point[data-id="lake"] .point-label { top:7px; left:auto; right:32px; transform:none; }
    #rainline-map-designs .point[data-id="ridge"] .point-label { top:auto; bottom:32px; }
    #rainline-map-designs .point[data-id="tower"] .point-label { left:auto; right:32px; transform:none; top:7px; }
    #rainline-map-designs .point[data-id="beach"] .point-label { top:32px; left:0; transform:none; }
    #rainline-map-designs .north { position:absolute; left:4%; top:7%; display:grid; justify-items:center; gap:3px; line-height:1; font-size:13px; font-weight:700; z-index:1; }
    #rainline-map-designs .north::after { content:""; width:14px; height:22px; background:currentColor; clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%); }
    #rainline-map-designs .scale { position:absolute; left:4%; bottom:6%; width:18%; box-sizing:border-box; border-top:1px solid currentColor; z-index:1; font-size:11px; line-height:1.7; display:flex; justify-content:space-between; white-space:nowrap; }
    #rainline-map-designs .scale::before, #rainline-map-designs .scale::after { content:""; position:absolute; height:5px; width:1px; background:currentColor; top:-5px; }
    #rainline-map-designs .scale::after { right:0; }
    #rainline-map-designs .sea-name { position:absolute; left:23%; top:24%; font-size:15px; letter-spacing:.45em; opacity:.78; pointer-events:none; }
    #rainline-map-designs .grid-coord { position:absolute; right:4%; top:5%; opacity:.80; font:500 11px/1.3 ui-monospace,monospace; }
    #rainline-map-designs .map-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; border-top:1px solid var(--line); padding:12px 20px; font-size:12px; }
    #rainline-map-designs .map-footer b, #rainline-map-designs .selection b { font-weight:650; }
    #rainline-map-designs .map-footer small, #rainline-map-designs .selection small { color:var(--secondary); font-size:12px; }
    #rainline-map-designs .map-footer .line-key { display:flex; align-items:center; gap:12px; color:var(--secondary); }
    #rainline-map-designs .line-key span::before { content:""; display:inline-block; width:16px; border-top:2px solid var(--text); margin-right:5px; vertical-align:.24em; }
    #rainline-map-designs .line-key span:last-child::before { border-top-style:dashed; }
    #rainline-map-designs .tactical .poi-menu { border-left:1px solid var(--line); padding-left:14px; }
    #rainline-map-designs .poi-menu h3 { font-size:12px; color:var(--secondary); margin:0 0 9px; letter-spacing:.13em; font-weight:620; }
    #rainline-map-designs .poi-buttons { display:flex; gap:5px; flex-wrap:wrap; }
    #rainline-map-designs .tactical .poi-buttons { display:grid; gap:0; }
    #rainline-map-designs .poi-button, #rainline-map-designs .route-toggle { border:1px solid var(--line); padding:7px 10px; font:inherit; font-size:12px; text-align:left; color:var(--text); background:var(--back); }
    #rainline-map-designs .tactical .poi-button { border:0; border-bottom:1px solid var(--line); padding:8px 6px; white-space:nowrap; }
    #rainline-map-designs .poi-button[aria-pressed="true"], #rainline-map-designs .route-toggle[aria-pressed="true"] { background:var(--chip); font-weight:620; }
    #rainline-map-designs .poi-button[aria-pressed="true"]::before { content:"◆"; margin-right:.4em; font-size:9px; }
    #rainline-map-designs .field .poi-button { border-inline:0; border-top:0; background:transparent; padding:7px 6px; }
    #rainline-map-designs .field .map-footer { padding-top:9px; padding-bottom:9px; }
    #rainline-map-designs .selection { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px 10px; min-width:0; }
    #rainline-map-designs .selection [data-description] { color:var(--secondary); }
    @container (max-width:660px) {
      #rainline-map-designs .map-screen { --stage:416px; }
      #rainline-map-designs .map-title { padding-inline:14px; }
      #rainline-map-designs .tactical .map-content { grid-template-columns:1fr; gap:7px; padding:7px 9px; }
      #rainline-map-designs .tactical .poi-menu { border:0; padding:0; }
      #rainline-map-designs .tactical .poi-buttons { display:flex; gap:5px; }
      #rainline-map-designs .tactical .poi-button { padding:6px 5px; }
      #rainline-map-designs .map-footer { padding-inline:12px; }
      #rainline-map-designs .field .map-content { padding-inline:9px; }
    }
    @container (max-width:460px) {
      #rainline-map-designs .point-label, #rainline-map-designs .grid-coord { display:none; }
      #rainline-map-designs .point-symbol { width:21px; height:21px; }
      #rainline-map-designs .point-symbol svg, #rainline-map-designs .point-symbol i { width:12px; height:12px; }
      #rainline-map-designs .sea-name { font-size:12px; }
      #rainline-map-designs .map-title h2 { font-size:19px; }
      #rainline-map-designs .map-context { font-size:11px; }
      #rainline-map-designs .map-footer { align-content:center; }
    }
  </style>

  <script>
    (() => {
      const root = document.getElementById('rainline-map-designs');
      const map = {"walk":[[88.453,26.812],[86.511,30.072],[84.892,30.072],[84.353,31.884],[83.633,34.058],[82.914,35.145],[81.655,37.609],[81.655,37.609],[78.957,36.957],[76.367,35.942],[73.741,36.304],[71.403,37.971],[69.281,40.217],[67.446,42.826],[65.719,46.304],[64.029,48.623],[62.77,49.783],[61.781,50.87],[61.871,53.768],[60.396,57.609],[58.489,60.072],[56.583,60.507],[55.288,58.116],[55.54,55.072],[56.691,54.638],[57.482,53.333],[57.158,51.449],[56.187,50.652]],"swim":[[57.158,51.449],[42.446,49.275],[27.374,49.275]],"island":[[28.058,50.0],[26.619,49.275],[24.964,48.768],[23.777,48.478],[22.014,49.42],[20.324,48.551],[20.144,46.014]],"marks":{"camp":[88.453,23.478],"lake":[78.417,52.174],"ridge":[61.781,50.87],"beach":[57.158,51.449],"island":[20.144,46.014],"tower":[91.007,76.087],"player":[88.453,26.812]}};
      const locations = [
        {id:'camp', name:'营地木屋', icon:'house', detail:'当前位置'},
        {id:'lake', name:'鹿鸣湖', icon:'waves', detail:'北岸接入海湾山径'},
        {id:'ridge', name:'海湾崖顶', icon:'mountain', detail:'海拔约 17 米 · 可俯瞰浅湾与小岛'},
        {id:'beach', name:'海湾沙滩', icon:'flag', detail:'穿过浅湾白浪礁线可登岛'},
        {id:'island', name:'外海小岛', icon:'trees', detail:'从东侧沙嘴上岸'},
        {id:'tower', name:'瞭望塔', icon:'binoculars', detail:'防水布所在塔台'},
      ];
      for (const screen of root.querySelectorAll('.map-screen')) {
        const plane = screen.querySelector('.map-plane');
        const canvas = screen.querySelector('canvas');
        const context = canvas.getContext('2d');
        const points = screen.querySelector('.map-points');
        const list = screen.querySelector('.poi-buttons');
        const toggle = screen.querySelector('.route-toggle');
        const options = { routeVisible:true, routeColor:screen.classList.contains('field') ? '#7d4b31' : '#f3bd72' };
        let selected = 'ridge';
        function draw() {
          if (!plane.clientWidth) return;
          const ratio = window.devicePixelRatio || 1;
          const width = plane.clientWidth, height = plane.clientHeight;
          canvas.width = width * ratio;
          canvas.height = height * ratio;
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
          screen.style.setProperty('--route', options.routeColor);
          if (!options.routeVisible) return;
          const water = getComputedStyle(screen).getPropertyValue('--water-route').trim();
          context.lineCap = 'round';
          context.lineJoin = 'round';
          for (const [segment, color, dashed] of [[map.walk,options.routeColor,false],[map.swim,water,true],[map.island,options.routeColor,false]]) {
            context.beginPath();
            segment.forEach(([u,v], index) => {
              if (index === 0) context.moveTo(u*width/100,v*height/100);
              else context.lineTo(u*width/100,v*height/100);
            });
            context.setLineDash(dashed ? [4,5] : []);
            context.strokeStyle = '#151d28b0';
            context.lineWidth = 4;
            context.stroke();
            context.strokeStyle = color;
            context.lineWidth = 1.75;
            context.stroke();
          }
        }
        function select(id) {
          selected = id;
          const point = locations.find(location => location.id === selected);
          screen.querySelector('[data-name]').textContent = point.name;
          screen.querySelector('[data-description]').textContent = point.detail;
          for (const mark of screen.querySelectorAll('[data-id]')) {
            mark.setAttribute('aria-pressed', String(mark.dataset.id === selected));
          }
        }
        for (const location of locations) {
          const mark = document.createElement('button');
          mark.type = 'button';
          mark.className = 'point cursor-interaction';
          mark.dataset.id = location.id;
          mark.setAttribute('aria-label', location.name);
          mark.style.left = map.marks[location.id][0] + '%';
          mark.style.top = map.marks[location.id][1] + '%';
          const symbol = document.createElement('span');
          symbol.className = 'point-symbol';
          symbol.setAttribute('aria-hidden', 'true');
          const icon = document.createElement('i');
          icon.dataset.lucide = location.icon;
          symbol.append(icon);
          const label = document.createElement('span');
          label.className = 'point-label';
          label.textContent = location.name;
          mark.append(symbol,label);
          mark.addEventListener('click', () => select(location.id));
          points.append(mark);
          if (list) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'poi-button cursor-interaction';
            button.dataset.id = location.id;
            button.textContent = location.name;
            button.addEventListener('click', () => select(location.id));
            list.append(button);
          }
        }
        toggle?.addEventListener('click', () => {
          options.routeVisible = !options.routeVisible;
          toggle.setAttribute('aria-pressed', String(options.routeVisible));
          draw();
        });
        select(selected);
        new ResizeObserver(draw).observe(plane);
        if (globalThis.Tweak) {
          const tweak = new Tweak({ container: screen, onChange: draw });
          tweak.addColorPicker(options, 'routeColor', { label:'路线颜色', reference:'--route' });
        }
      }
      globalThis.lucide?.createIcons({ attrs:{ width:15, height:15 } });
    })();
  </script>
