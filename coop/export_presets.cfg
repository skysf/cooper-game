[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
export_filter="all_resources"
include_filter="world.json,water_layout.json,sky-assets.LICENSE.txt,fonts/*.txt"
exclude_filter="server.gd"
export_path="../dist/coop/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://../.cache/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="res://shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=false
progressive_web_app/enabled=false

[preset.1]
name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
export_filter="all_resources"
include_filter="world.json,water_layout.json,sky-assets.LICENSE.txt,fonts/*.txt"
exclude_filter="server.gd"
export_path="../dist/coop-native/CooperCamp.app"
script_export_mode=2

[preset.1.options]
custom_template/release="res://../.cache/templates/macos.zip"
application/bundle_identifier="local.cooper.raincamp"
application/short_version="1.0"
application/version="1.0"
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>雨线营地需要访问局域网，以加入队友的房间并加载营地地图。</string>"
codesign/codesign=1
notarization/notarization=0
