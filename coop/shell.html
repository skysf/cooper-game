button, input, a { font: inherit; }

  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(ellipse at 50% 68%, #253a3b 0%, var(--panel) 55%, var(--dark) 100%);
}
.startup, #invitePanel {
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--panel);
  box-shadow: 0 14px 48px #09101166;
}
.startup {
  width: min(448px, 100%);
  padding: clamp(19px, 5vw, 32px);
  border-top: 2px solid var(--amber);
}
h1, h2, p { margin: 0; }
h1 { margin-bottom: 28px; font-size: clamp(30px, 5vw, 42px); line-height: 1.25; font-weight: 650; }
.load-state { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 5px 12px; }
#phase { color: var(--ink); font-size: 15px; line-height: 1.5; }
#loadPercent { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
progress {
  display: block;
  width: 100%;
  height: 5px;
  margin-top: 12px;
  overflow: hidden;
  border: none;
  border-radius: 3px;
  background: var(--tile);
  accent-color: var(--amber);
}
progress::-webkit-progress-bar { background: var(--tile); }
progress::-webkit-progress-value { background: var(--amber); }
progress::-moz-progress-bar { background: var(--amber); }
.shell-button {
  display: inline-flex;
  min-height: 35px;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--tile);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.3;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.shell-button:hover { border-color: var(--amber); }
.shell-button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.shell-button.primary { color: var(--dark); background: var(--amber); border-color: var(--amber); font-weight: 650; }
#fresh { position: fixed; right: 14px; bottom: 14px; }
.startup #fresh { position: static; margin-top: 17px; }
#invitePanel { position: fixed; width: min(350px, calc(100vw - 24px)); padding: 13px; }
.invite-header, .invite-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.invite-header { margin-bottom: 10px; }
.invite-header h2 { font-size: 17px; font-weight: 650; }
#inviteClose { min-height: 29px; padding: 4px 8px; }
#inviteLink {
  display: block;
  width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 8px;
  border: 1px solid var(--edge);
  border-radius: 4px;
  background: var(--well);
  color: var(--ink);
  font-size: 14px;
}
#inviteLink:focus { border-color: var(--amber); outline: none; }
#inviteLink::selection { background: #594934; color: var(--ink); }
.invite-actions { align-items: center; margin-top: 10px; }
#inviteStatus { color: var(--muted); font-size: 12px; line-height: 1.4; }
#inviteStatus[data-copied] { color: var(--amber); }
</style>
</head>
<body>
<main><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="雨线营地"></canvas></main>
<section id="loader" aria-labelledby="loaderTitle">
  <div class="startup" id="startup">
    <h1 id="loaderTitle">雨线营地</h1>
    <div class="load-state">
      <p id="phase" role="status">正在打开营地…</p>
      <span id="loadPercent" aria-hidden="true">0%</span>
    </div>
    <progress id="bar" max="100" value="0" aria-label="游戏加载进度"></progress>
  </div>
</section>
<a hidden id="fresh" class="shell-button">另开营地</a>
<section hidden id="invitePanel" aria-labelledby="inviteHeading">
  <header class="invite-header">
    <h2 id="inviteHeading">房间邀请链接</h2>
    <button id="inviteClose" class="shell-button" type="button" aria-label="关闭邀请链接">关闭</button>
  </header>
  <input readonly id="inviteLink" aria-labelledby="inviteHeading">
  <div class="invite-actions">
    <p id="inviteStatus" role="status">按 ⌘C 或 Ctrl+C 复制链接</p>
    <button id="inviteCopy" class="shell-button primary" type="button">复制链接</button>
  </div>
</section>
<script src="$GODOT_URL"></script>
<script>
const canvas = document.getElementById('canvas');
const box = document.getElementById('loader');
const startup = document.getElementById('startup');
const phase = document.getElementById('phase');
const bar = document.getElementById('bar');
const loadPercent = document.getElementById('loadPercent');
const fresh = document.getElementById('fresh');
const invitePanel = document.getElementById('invitePanel');
const inviteLink = document.getElementById('inviteLink');
const inviteStatus = document.getElementById('inviteStatus');
const room = new URLSearchParams(location.search).get('room') || 'pine';
const startNew = () => 'camp-' + Array.from(crypto.getRandomValues(new Uint8Array(4)),
  value => value.toString(16).padStart(2, '0')).join('');
fresh.href = '?room=' + startNew();
window.CooperJoin = {
  url: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/room',
  room, token: '', pointerLocked: false, menuOpen: true, backpackOpen: false, atlasOpen: false, inviteVisible: false,
  zoneBase: location.origin + '/coop/zones/',
};

function canvasGameRect(frame, state, bounds) {
  const [x, y, width, height] = bounds;
  const sx = frame.width / state.viewport[0];
  const sy = frame.height / state.viewport[1];
  return new DOMRect(frame.left + x*sx, frame.top + y*sy, width*sx, height*sy);
}

function placeShellActions() {
  if (fresh.hidden && invitePanel.hidden) return;
  const frame = canvas.getBoundingClientRect();
  const inset = 12;
  if (!fresh.hidden && box.hidden) {
    fresh.style.right = Math.max(inset, innerWidth - frame.right + inset) + 'px';
    fresh.style.bottom = Math.max(inset, innerHeight - frame.bottom + inset) + 'px';
  }
  const state = window.CooperStatus;
  if (invitePanel.hidden || !state) return;
  const panel = canvasGameRect(frame, state, state.panelRect);
  const popup = invitePanel.getBoundingClientRect();
  const buttonTop = fresh.hidden ? frame.bottom : fresh.getBoundingClientRect().top;
  const gap = 12;
  let x = panel.right + gap;
  let y = Math.min(panel.bottom, buttonTop - gap) - popup.height;
  if (x + popup.width > frame.right - inset) {
    x = panel.left;
    y = panel.top - popup.height - gap;
  }
  x = Math.max(inset, Math.min(x, innerWidth - popup.width - inset));
  y = Math.max(inset, Math.min(y, innerHeight - popup.height - inset));
  invitePanel.style.left = x + 'px';
  invitePanel.style.top = y + 'px';
}

function syncRoomAction() {
  if (!box.hidden) return;
  fresh.hidden = !CooperJoin.menuOpen || CooperJoin.pointerLocked || CooperJoin.backpackOpen || CooperJoin.atlasOpen;
  if (!fresh.hidden) placeShellActions();
}

function hideInvite() {
  if (invitePanel.hidden) return;
  invitePanel.hidden = true;
  CooperJoin.inviteVisible = false;
}

async function copyInvite() {
  inviteLink.focus({preventScroll: true});
  inviteLink.select();
  inviteStatus.removeAttribute('data-copied');
  inviteStatus.textContent = '按 ⌘C 或 Ctrl+C 复制链接';
  try {
    await navigator.clipboard?.writeText(inviteLink.value);
    if (navigator.clipboard) {
      inviteStatus.textContent = '链接已复制';
      inviteStatus.setAttribute('data-copied', '');
    }
  } catch {
    // The selected field still supports keyboard copying on plain HTTP.
  }
}

function showInvite() {
  inviteLink.value = CooperJoin.inviteUrl;
  invitePanel.hidden = false;
  CooperJoin.inviteVisible = true;
  placeShellActions();
  void copyInvite();
}

function dismissInvite() {
  hideInvite();
  canvas.focus({preventScroll: true});
}

CooperJoin.setPanelOpen = (open, atlasOpen) => {
  CooperJoin.backpackOpen = open && !atlasOpen;
  CooperJoin.atlasOpen = atlasOpen;
  if (open) {
    hideInvite();
    canvas.focus({preventScroll: true});
  }
  syncRoomAction();
};
CooperJoin.setMenuOpen = open => {
  CooperJoin.menuOpen = open;
  if (!open) hideInvite();
  syncRoomAction();
};
let resumeAfterUnlock = false;
CooperJoin.releasePointer = () => {
  resumeAfterUnlock = false;
  CooperJoin.pointerLocked = false;
  if (document.pointerLockElement === canvas) document.exitPointerLock();
};
CooperJoin.resumeFromPanel = () => {
  if (!box.hidden || CooperJoin.atlasOpen || CooperJoin.backpackOpen || !document.hasFocus()) return;
  if (document.pointerLockElement === canvas) {
    resumeAfterUnlock = true;
    return;
  }
  canvas.focus({preventScroll: true});
  canvas.requestPointerLock()?.catch(() => {});
};
window.addEventListener('resize', placeShellActions);
new ResizeObserver(placeShellActions).observe(canvas);
inviteLink.addEventListener('click', () => inviteLink.select());
document.getElementById('inviteClose').addEventListener('click', dismissInvite);
document.getElementById('inviteCopy').addEventListener('click', () => void copyInvite());
// Fetch already decodes HTTP Content-Encoding before exposing arrayBuffer().
CooperJoin.fetchZone = function(url) {
  const ticket = {done:false, bytes:null, error:''};
  const abort = new AbortController();
  const timeout = setTimeout(() => abort.abort(), 30000);
  fetch(url, {signal:abort.signal}).then(response => {
    if (!response.ok) throw Error('HTTP '+response.status);
    return response.arrayBuffer();
  }).then(bytes => {ticket.bytes=bytes;})
    .catch(error => {ticket.error=String(error);})
    .finally(() => {clearTimeout(timeout);ticket.done=true;});
  return ticket;
};

const config=$GODOT_CONFIG;
config.canvas=canvas;config.canvasResizePolicy=0;
// BufferSource loops wrap on the audio clock, even while a camera turn occupies the game thread.
const BrowserAudioContext=window.AudioContext||window.webkitAudioContext;
if(BrowserAudioContext) window.CooperAmbience=createCampAudio(BrowserAudioContext);
// Ordinary HTTP LAN pages also use this mixer for positional effects.
if(typeof Engine!=='undefined' && !Engine.isAudioWorkletAvailable()) {
  config.args=[...(config.args||[]),'--audio-driver','Dummy'];
  if(BrowserAudioContext) window.CooperAudio=window.CooperAmbience;
}

function createCampAudio(AudioContextClass){
  const clips=new Map(), ambientVoices=new Map();
  let context, voices=[], engineVoice, count=0, cursor=0;
  function channel(){
    const gain=context.createGain();
    const pan=context.createStereoPanner?.();
    if(pan) gain.connect(pan).connect(context.destination);
    else gain.connect(context.destination);
    return {gain,pan,source:null,priority:0};
  }
  function stop(voice){
    if(!voice?.source) return;
    voice.source.onended=null;
    voice.source.stop();
    voice.source.disconnect();
    voice.source=null;
  }
  function buffer(name){
    const clip=clips.get(name);
    if(!clip) return null;
    if(!clip.buffer){
      // Godot WAV samples are interleaved signed 16-bit little-endian PCM.
      const bytes=atob(clip.pcm);
      clip.buffer=context.createBuffer(clip.channels,bytes.length/(2*clip.channels),clip.rate);
      for(let c=0;c<clip.channels;c++){
        const samples=clip.buffer.getChannelData(c);
        for(let i=0,byte=c*2;i<samples.length;i++,byte+=2*clip.channels){
          const value=bytes.charCodeAt(byte)|(bytes.charCodeAt(byte+1)<<8);
          samples[i]=(value>=32768?value-65536:value)/32768;
        }
      }
      delete clip.pcm;
    }
    return clip.buffer;
  }
  function start(voice,name,volume,pitch,pan,loop=false,offset=0){
    const samples=buffer(name);
    if(!samples) return;
    stop(voice);
    const source=context.createBufferSource();
    source.buffer=samples;
    source.loop=loop;
    source.playbackRate.value=pitch;
    voice.gain.gain.cancelScheduledValues(context.currentTime);
    voice.gain.gain.value=volume;
    if(voice.pan){
      voice.pan.pan.cancelScheduledValues(context.currentTime);
      voice.pan.pan.value=pan;
    }
    source.connect(voice.gain);
    source.onended=()=>{
      source.disconnect();
      if(voice.source===source) voice.source=null;
    };
    voice.source=source;
    source.start(0, Math.min(offset,samples.duration));
  }
  function configureVoices(){
    if(context && count && !engineVoice){
      voices=Array.from({length:count},channel);
      engineVoice=channel();
    }
  }
  function unlock(){
    if(!context && clips.size) context=new AudioContextClass();
    configureVoices();
    if(context?.state!=='running') context?.resume().catch(()=>{});
  }
  function stopAmbience(){
    for(const voice of ambientVoices.values()) stop(voice);
  }
  canvas.addEventListener('pointerdown',unlock);
  canvas.addEventListener('keydown',unlock);
  return {
    configure(voiceCount){count=voiceCount;configureVoices();},
    register(name,rate,pcm,channels=1){clips.set(name,{rate,pcm,channels});},
    play(name,volume,pitch,pan,priority,offset=0){
      if(context?.state!=='running') return;
      let slot=-1;
      for(let index=0;index<count;index++){
        const candidate=(index+cursor)%count;
        if(!voices[candidate].source){slot=candidate;break;}
        if(slot<0 && voices[candidate].priority<priority) slot=candidate;
      }
      if(slot<0) return;
      const voice=voices[slot];
      voice.priority=priority;
      cursor=(slot+1)%count;
      start(voice,name,volume,pitch,pan,false,offset);
    },
    engine(name,volume,pitch,pan){
      if(context?.state!=='running') return;
      if(!engineVoice.source){start(engineVoice,name,volume,pitch,pan,true);return;}
      const now=context.currentTime;
      engineVoice.gain.gain.setTargetAtTime(volume,now,0.035);
      engineVoice.source.playbackRate.setTargetAtTime(pitch,now,0.035);
      engineVoice.pan?.pan.setTargetAtTime(pan,now,0.035);
    },
    ambient(name,volume,pan){
      if(context?.state!=='running') return;
      let voice=ambientVoices.get(name);
      if(volume<=0){stop(voice);return;}
      if(!voice){voice=channel();ambientVoices.set(name,voice);}
      if(!voice.source){start(voice,name,volume,1,pan,true);return;}
      const now=context.currentTime;
      voice.gain.gain.setTargetAtTime(volume,now,0.04);
      voice.pan?.pan.setTargetAtTime(pan,now,0.04);
    },
    stopAmbience,
    stopEngine(){stop(engineVoice);},
    silence(){
      stop(engineVoice);
      for(const voice of voices) stop(voice);
      stopAmbience();
    },
  };
}
function showLoading(message, progress) {
  if (phase.textContent !== message) phase.textContent = message;
  const percent = Math.max(bar.value, Math.floor(progress));
  if (bar.value !== percent) {
    bar.value = percent;
    loadPercent.textContent = percent + '%';
  }
}

const DOWNLOAD_END = 70;
let downloading = true;
config.onProgress = (loaded, total) => {
  if (!downloading) return;
  const fraction = total > 0 ? Math.min(1, loaded / total) : 0;
  showLoading(fraction === 1 ? '正在启动游戏引擎…' : '正在下载游戏资源…', DOWNLOAD_END * fraction);
};

function loadingError(message) {
  downloading = false;
  phase.textContent = message;
  bar.hidden = true;
  loadPercent.hidden = true;
  startup.appendChild(fresh);
  fresh.hidden = false;
}

function showWarmup(state) {
  const {stage, done, total} = state.previewProgress || {};
  const progress = (count, start, end) => start + (end - start) * Math.min(1, count / total);
  switch (stage) {
    case 'world':
      showLoading('正在准备场景…', progress(done, 75, 88));
      break;
    case 'character':
      showLoading('正在准备角色预览…', 89);
      break;
    case 'people':
      showLoading('正在准备营地人物…', progress(state.peopleWarmupCount, 91, 96));
      break;
    default:
      showLoading('正在准备光照…', 73);
  }
}

function updateStartup() {
  const state = window.CooperStatus;
  if (!state) return false;
  if (state.ready) {
    showLoading('可以进入林地', 100);
    box.hidden = true;
    if (fresh.parentNode === startup) document.body.appendChild(fresh);
    syncRoomAction();
    return true;
  }
  if (state.previewWarming) {
    showWarmup(state);
    return false;
  }
  const showFresh = !state.connected || Boolean(state.terrainError);
  if (showFresh && fresh.parentNode !== startup) startup.appendChild(fresh);
  fresh.hidden = !showFresh;
  if (!state.connected) {
    showLoading(state.status || '正在连接房间…', 97);
  } else {
    showLoading(state.terrainError ? '林区加载失败，正在重试…' : '正在加载脚下的林区…', 98);
  }
  return false;
}

if (!/^[a-z0-9_-]{1,24}$/.test(room)) {
  loadingError('房间名可用 1–24 位小写字母、数字、下划线或短横线。');
} else {
  const start = async () => {
    let origin = location.origin;
    if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
      try {
        const data = await (await fetch('/health')).json();
        origin = data.advertised || origin;
      } catch {}
    }
    CooperJoin.inviteUrl = origin + '/coop/?room=' + encodeURIComponent(room);
    await new Engine(config).startGame();
  };
  start().then(() => {
    downloading = false;
    showLoading('正在初始化营地…', 72);
    if (updateStartup()) return;
    const wait = setInterval(() => {
      if (updateStartup()) clearInterval(wait);
    }, 80);
  }).catch(error => loadingError('载入失败 · ' + error));
}

canvas.addEventListener('click', event => {
  const state = window.CooperStatus;
  if (!state?.ready || document.pointerLockElement || !box.hidden || CooperJoin.backpackOpen || state.backpackOpen || CooperJoin.atlasOpen || state.atlas?.open) return;
  const frame = canvas.getBoundingClientRect();
  const inside = bounds => {
    if (!bounds) return false;
    const rect = canvasGameRect(frame, state, bounds);
    return event.clientX >= rect.left && event.clientX < rect.right && event.clientY >= rect.top && event.clientY < rect.bottom;
  };
  if (CooperJoin.menuOpen) {
    if (inside(state.inviteRect)) {
      showInvite();
      return;
    }
    if (inside(state.panelRect) && !inside(state.enterRect)) return;
  }
  canvas.focus();
  const request = canvas.requestPointerLock();
  request?.catch(error => console.warn('Pointer lock:', error.message));
});
canvas.addEventListener('contextmenu', event => {
  if (document.pointerLockElement === canvas || CooperJoin.atlasOpen) event.preventDefault();
});
canvas.addEventListener('wheel', event => {
  if (CooperJoin.atlasOpen) event.preventDefault();
}, {passive: false});
document.addEventListener('pointerlockchange', () => {
  CooperJoin.pointerLocked = document.pointerLockElement === canvas;
  if (CooperJoin.pointerLocked) {
    hideInvite();
    if (CooperJoin.backpackOpen || CooperJoin.atlasOpen) CooperJoin.releasePointer();
  } else if (resumeAfterUnlock) {
    resumeAfterUnlock = false;
    CooperJoin.resumeFromPanel();
  }
  syncRoomAction();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !invitePanel.hidden) dismissInvite();
  if (event.code === 'Space' && document.pointerLockElement === canvas) event.preventDefault();
  if (event.code === 'Tab' && !event.altKey && !event.ctrlKey && !event.metaKey && event.target === canvas &&
    window.CooperStatus?.ready && window.CooperStatus?.survival?.bag) event.preventDefault();
});
</script>
</body>
</html>
